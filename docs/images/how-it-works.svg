<svg xmlns="http://www.w3.org/2000/svg" width="728" height="176" viewBox="0 0 728 176" role="img" aria-labelledby="title desc">
  <title id="title">How KEF Remote works</title>
  <desc id="desc">A key press goes to the KEF Remote app, which sends the command to the KEF speaker over TCP on port 50001. To find the speaker, the app sends an SSDP search on the local network, and the speaker replies with its IP.</desc>
  <!-- Its own dark background, in the app icon's colours, so it reads the same in GitHub's light and dark themes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212f4e"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <marker id="tcp-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#37c6e1"/>
    </marker>
    <marker id="ssdp-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ee0c5"/>
    </marker>
  </defs>
  <style>
    .box { fill: #293651; stroke: #4b5b7c; stroke-width: 1.5; }
    .name { fill: #f2f5fa; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .note { fill: #a9b4c8; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tcp { stroke: #37c6e1; stroke-width: 2; fill: none; }
    .ssdp { stroke: #3ee0c5; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .tcp-label { fill: #37c6e1; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ssdp-label { fill: #3ee0c5; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>

  <rect width="728" height="176" rx="14" fill="url(#bg)"/>

  <!-- Key press -->
  <rect class="box" x="24" y="24" width="160" height="64" rx="10"/>
  <text class="name" x="104" y="51" text-anchor="middle">Key press</text>
  <text class="note" x="104" y="71" text-anchor="middle">Control + volume up</text>

  <!-- App -->
  <rect class="box" x="284" y="24" width="160" height="64" rx="10"/>
  <text class="name" x="364" y="51" text-anchor="middle">KEF Remote</text>
  <text class="note" x="364" y="71" text-anchor="middle">menu bar app</text>

  <!-- Speaker -->
  <rect class="box" x="544" y="24" width="160" height="64" rx="10"/>
  <text class="name" x="624" y="51" text-anchor="middle">KEF speaker</text>
  <text class="note" x="624" y="71" text-anchor="middle">LSX on your network</text>

  <!-- Key press to app -->
  <line class="tcp" x1="186" y1="56" x2="281" y2="56" marker-end="url(#tcp-head)"/>

  <!-- App to speaker: the command, over TCP -->
  <text class="tcp-label" x="494" y="47" text-anchor="middle">TCP :50001</text>
  <line class="tcp" x1="446" y1="56" x2="541" y2="56" marker-end="url(#tcp-head)"/>

  <!-- Discovery: one two-way line under the boxes -->
  <text class="ssdp-label" x="24" y="125">Finding the speaker</text>
  <text class="note" x="24" y="145">at launch, and if its IP changes</text>
  <path class="ssdp" d="M364 91 V130 H624 V91" marker-start="url(#ssdp-head)" marker-end="url(#ssdp-head)"/>
  <text class="ssdp-label" x="494" y="121" text-anchor="middle">SSDP search →</text>
  <text class="ssdp-label" x="494" y="151" text-anchor="middle">← reply with IP</text>
</svg>
